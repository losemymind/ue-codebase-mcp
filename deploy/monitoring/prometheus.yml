global:
  scrape_interval: 30s
  scrape_timeout: 5s
  evaluation_interval: 30s

scrape_configs:
  - job_name: ue-codebase-mcp-control-plane
    scheme: http
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_bearer_token
    static_configs:
      - targets:
          - control-plane:8081
