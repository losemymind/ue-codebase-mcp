worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 512;
  multi_accept off;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log off;
  error_log /dev/stderr crit;

  map "$content_length:$http_transfer_encoding" $request_has_body {
    default 1;
    ":" 0;
    "0:" 0;
  }

  limit_conn_zone $binary_remote_addr zone=per_client_connections:10m;
  limit_req_zone $binary_remote_addr zone=per_client_requests:10m rate=10r/s;

  client_header_timeout 10s;
  client_body_timeout 15s;
  client_header_buffer_size 1k;
  large_client_header_buffers 2 8k;
  keepalive_timeout 15s;
  keepalive_requests 100;
  send_timeout 30s;
  reset_timedout_connection on;

  server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /run/secrets/tls.crt;
    ssl_certificate_key /run/secrets/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 10m;

    limit_conn per_client_connections 20;
    limit_req zone=per_client_requests burst=20 nodelay;

    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /mcp {
      limit_except POST { deny all; }
      client_max_body_size 1m;
      proxy_request_buffering on;
      proxy_buffering off;
      proxy_http_version 1.1;
      proxy_connect_timeout 5s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Proto https;
      proxy_pass http://control-plane:8080;
    }

    location = /.well-known/oauth-protected-resource {
      limit_except GET { deny all; }
      if ($request_has_body) { return 413; }
      proxy_http_version 1.1;
      proxy_connect_timeout 5s;
      proxy_send_timeout 10s;
      proxy_read_timeout 10s;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Proto https;
      proxy_pass http://control-plane:8080;
    }

    location = /health/live {
      limit_except GET { deny all; }
      if ($request_has_body) { return 413; }
      proxy_http_version 1.1;
      proxy_connect_timeout 2s;
      proxy_send_timeout 5s;
      proxy_read_timeout 5s;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Proto https;
      proxy_pass http://control-plane:8081;
    }

    location = /health/ready {
      limit_except GET { deny all; }
      if ($request_has_body) { return 413; }
      proxy_http_version 1.1;
      proxy_connect_timeout 2s;
      proxy_send_timeout 5s;
      proxy_read_timeout 5s;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Proto https;
      proxy_pass http://control-plane:8081;
    }

    location = /metrics {
      return 404;
    }

    location / {
      return 404;
    }
  }
}
